<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newsletter Extractor</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --border:#e5e7eb; --fg:#1f2937; --muted:#6b7280;
    --acc:#1ba9c2; --acc-d:#168aa0; --ok:#16a34a; --err:#dc2626; --warn:#d97706;
    --field-bg:#fff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:20px}
  .head{max-width:1200px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:20px}
  .user{font-size:12px;color:var(--muted)}
  .user b{color:var(--fg)}
  .logout{color:var(--muted);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:6px 10px;border-radius:6px;margin-left:10px;background:#fff}
  .container{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:20px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  label{display:block;font-size:13px;font-weight:500;margin:14px 0 6px;color:var(--fg)}
  label.req::before{content:'* ';color:var(--err)}
  label:first-child{margin-top:0}
  input,select,textarea{font:inherit;color:var(--fg);background:var(--field-bg);border:1px solid var(--border);border-radius:6px;padding:8px 10px;width:100%}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 2px rgba(27,169,194,.15)}
  textarea{min-height:280px;font-family:ui-monospace,monospace;font-size:12px;resize:vertical}
  .tabs{display:flex;gap:0;border:1px solid var(--border);border-radius:6px;overflow:hidden;width:fit-content}
  .tab{padding:8px 18px;background:#fff;border:0;border-right:1px solid var(--border);cursor:pointer;font-weight:600;font-size:12px;color:var(--fg);letter-spacing:.5px}
  .tab:last-child{border-right:0}
  .tab.active{background:var(--acc);color:#fff}
  .blue-link{color:var(--acc);font-size:11px;font-weight:400}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .filters-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end}
  .filters-grid .ic{background:transparent;border:1px solid var(--border);border-radius:6px;padding:8px 10px;cursor:pointer;color:var(--muted);height:36px}
  .filters-grid .ic:hover{color:var(--err);border-color:var(--err)}
  .add-filter{margin-top:8px;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
  .add-filter:hover{color:var(--acc);border-color:var(--acc)}
  .btn-row{display:flex;gap:10px;margin-top:20px}
  .btn{padding:10px 18px;border-radius:6px;border:0;font-weight:600;cursor:pointer;font-size:14px}
  .btn.primary{background:var(--acc);color:#fff;flex:1}
  .btn.primary:hover{background:var(--acc-d)}
  .btn.danger{background:var(--err);color:#fff}
  .btn.sec{background:#fff;color:var(--fg);border:1px solid var(--border)}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .log{background:#1a1a1a;color:#d4d4d4;border-radius:6px;padding:12px;height:200px;overflow:auto;font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;line-height:1.5}
  .results{margin-top:12px;border:1px solid var(--border);border-radius:6px;max-height:300px;overflow:auto}
  .results-head{padding:8px 12px;background:#fafafa;border-bottom:1px solid var(--border);font-size:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .result-item{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);font-size:12px;cursor:pointer;text-decoration:none;color:var(--fg)}
  .result-item:hover{background:#f0fdff}
  .result-item:last-child{border-bottom:0}
  .result-meta{flex:1;min-width:0;margin-right:8px}
  .result-subj{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result-info{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .result-size{font-size:11px;color:var(--acc);font-weight:600;margin-top:2px}
  .result-dl{color:var(--acc);font-size:11px;flex-shrink:0}
  .status-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .status{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:#eef;color:var(--muted)}
  .status.running{background:#dbeafe;color:#1d4ed8}
  .status.cancelling,.status.cancelled{background:#fef3c7;color:#92400e}
  .status.done{background:#dcfce7;color:#166534}
  .status.error{background:#fee2e2;color:#991b1b}
  .hint{font-size:11px;color:var(--muted);margin-top:4px}
  .filters-title{font-size:13px;font-weight:600;margin:20px 0 8px}
  @media(max-width:900px){.container{grid-template-columns:1fr}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="head">
  <h1>📬 Newsletter Extractor</h1>
  <div>
    <span class="user">Signed in as <b id="who">…</b></span>
    <a class="logout" href="/logout">Sign out</a>
  </div>
</div>

<div class="container">

  <div class="card">
    <div class="row2">
      <div>
        <label class="req">Email Service Provider</label>
        <div class="tabs" id="provider-tabs">
          <button class="tab active" data-p="gmail">GMAIL</button>
          <button class="tab" data-p="yahoo">YAHOO</button>
          <button class="tab" data-p="hotmail">HOTMAIL</button>
          <button class="tab" data-p="others">OTHERS</button>
        </div>
      </div>
      <div>
        <label class="req">Folder</label>
        <select id="folder">
          <option value="all">All</option>
          <option value="archive">Archive</option>
          <option value="drafts">Drafts</option>
          <option value="flagged">Flagged</option>
          <option value="junk">Junk</option>
          <option value="sent">Sent</option>
          <option value="trash">Trash</option>
          <option value="inbox" selected>Inbox</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div>
        <label class="req">Symbol Separator</label>
        <input id="sym_sep" placeholder="Delimiter should only include symbols as ²/!#$%^&*()_+=|{}[]<>?~\\-">
      </div>
      <div>
        <label class="req">Return Type</label>
        <select id="return_type">
          <option value="html" selected>Raw HTML (one line)</option>
          <option value="text">Text only (links removed)</option>
          <option value="html_no_text">HTML structure only (no text)</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div>
        <label class="req">Mailboxes List <span class="blue-link">(Email:Password)</span></label>
        <textarea id="creds" placeholder="me@gmail.com:app_password&#10;other@yahoo.com:xxxx"></textarea>
      </div>
      <div>
        <label>Max Emails Number</label>
        <input id="max_emails" type="number" value="0" min="0">
        <div class="hint">0 = unlimited</div>

        <label>Email Order</label>
        <select id="order">
          <option value="old_to_new">Old To New</option>
          <option value="new_to_old" selected>New To Old</option>
        </select>

        <label>Result Separator</label>
        <input id="result_sep" value="_SEPARATOR_">

        <label>Filter Operator</label>
        <select id="filter_op">
          <option value="and" selected>And</option>
          <option value="or">Or</option>
        </select>
      </div>
    </div>

    <div class="filters-title">Filters</div>
    <div id="filters"></div>
    <button class="add-filter" id="add-filter">+ Add filter</button>

    <div class="btn-row">
      <button class="btn primary" id="go">▶ Start extraction</button>
      <button class="btn danger" id="stop" disabled>■ Stop</button>
      <button class="btn sec" id="dl" disabled>⬇ Download all (.zip)</button>
    </div>
  </div>

  <div class="card">
    <div class="status-bar">
      <div><b>Status:</b> <span id="status" class="status">idle</span></div>
      <small class="hint" id="jobid"></small>
    </div>
    <div class="log" id="log">Waiting…</div>
    <div class="results" id="results-wrap" style="display:none">
      <div class="results-head">
        <span>Results (<span id="results-count">0</span>)</span>
        <span class="hint">Click any item to download as .txt</span>
      </div>
      <div id="results-list"></div>
    </div>
  </div>

</div>

<script>
const $ = id => document.getElementById(id);

fetch('/me').then(r=>r.json()).then(j=>{ $('who').textContent = j.user || '?'; });

// Provider tabs
let provider = 'gmail';
document.querySelectorAll('#provider-tabs .tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('#provider-tabs .tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    provider = t.dataset.p;
  });
});

// Filters
const filtersEl = $('filters');
function renderFilters(){
  filtersEl.innerHTML = '';
  filters.forEach((f, i) => {
    const row = document.createElement('div');
    row.className = 'filters-grid';
    row.innerHTML = `
      <div><label style="margin:0 0 4px">Header parameter</label>
        <input data-i="${i}" data-k="param" placeholder="Header" value="${f.param||''}"></div>
      <div><label style="margin:0 0 4px">Filter type</label>
        <select data-i="${i}" data-k="type">
          <option value="contains" ${f.type==='contains'?'selected':''}>Contains</option>
          <option value="equals" ${f.type==='equals'?'selected':''}>Equals</option>
          <option value="starts_with" ${f.type==='starts_with'?'selected':''}>Starts with</option>
          <option value="ends_with" ${f.type==='ends_with'?'selected':''}>Ends with</option>
          <option value="not_contains" ${f.type==='not_contains'?'selected':''}>Not contains</option>
          <option value="regex" ${f.type==='regex'?'selected':''}>Regex</option>
        </select></div>
      <div><label style="margin:0 0 4px">Header value</label>
        <input data-i="${i}" data-k="value" placeholder="Value" value="${f.value||''}"></div>
      <button class="ic" data-del="${i}">✕</button>`;
    filtersEl.appendChild(row);
  });
  filtersEl.querySelectorAll('input,select').forEach(el => {
    el.addEventListener('input', e=>{
      const i=+e.target.dataset.i, k=e.target.dataset.k;
      filters[i][k] = e.target.value;
    });
  });
  filtersEl.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', e=>{
      filters.splice(+e.target.dataset.del,1); renderFilters();
    });
  });
}
let filters = [];
$('add-filter').addEventListener('click', ()=>{
  filters.push({param:'', type:'contains', value:''}); renderFilters();
});

// Job control
let jobId = null, poll = null;

function setStatus(s){
  const el = $('status'); el.textContent = s;
  el.className = 'status ' + (['running','done','error','cancelling','cancelled'].includes(s) ? s : '');
}
function setActive(a){ $('go').disabled = a; $('stop').disabled = !a; }

$('go').addEventListener('click', async ()=>{
  const lines = $('creds').value.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  const credentials = lines.map(l=>{
    const i = l.indexOf(':');
    return i>0 ? { email: l.slice(0,i).trim(), password: l.slice(i+1).trim() } : null;
  }).filter(Boolean);
  if(!credentials.length){ alert('Add at least one credential'); return; }

  const params = {
    credentials,
    provider,
    folder: $('folder').value,
    return_type: $('return_type').value || 'html',
    symbol_separator: $('sym_sep').value,
    result_separator: $('result_sep').value || '_SEPARATOR_',
    max_emails: $('max_emails').value || 0,
    order: $('order').value,
    filter_operator: $('filter_op').value,
    filters,
    batch_size: 10,
  };
  setActive(true); $('dl').disabled = true; $('log').textContent = '';
  $('results-wrap').style.display='none'; $('results-list').innerHTML='';
  setStatus('starting');
  const r = await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)});
  if(r.status===401){ window.location='/login'; return; }
  const j = await r.json();
  if(j.error){ setStatus('error'); $('log').textContent=j.error; setActive(false); return; }
  jobId = j.job_id;
  $('jobid').textContent = 'Job: ' + jobId.slice(0,8);
  poll = setInterval(checkStatus, 1200);
});

$('stop').addEventListener('click', async ()=>{
  if(!jobId) return;
  if(!confirm('Stop the current extraction? Partial results will be saved.')) return;
  $('stop').disabled = true; setStatus('cancelling');
  await fetch('/stop/'+jobId, {method:'POST'});
});

function fmtSize(n){
  if(n<1024) return n+'B';
  if(n<1024*1024) return (n/1024).toFixed(1)+'KB';
  return (n/1024/1024).toFixed(1)+'MB';
}

function renderResults(files){
  const wrap = $('results-wrap'), list = $('results-list');
  if(!files || !files.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  $('results-count').textContent = files.length;
  list.innerHTML = files.map(f => `
    <a class="result-item" href="/file/${jobId}/${encodeURIComponent(f.name)}" download>
      <div class="result-meta">
        <div class="result-subj">${(f.subject||'(no subject)').replace(/[<>]/g,'')}</div>
        <div class="result-info">${(f.from||'').replace(/[<>]/g,'')} · ${f.email}</div>
        <div class="result-size">📄 ${fmtSize(f.size)}</div>
      </div>
      <div class="result-dl">⬇ .txt</div>
    </a>`).join('');
}

async function checkStatus(){
  if(!jobId) return;
  const r = await fetch('/status/'+jobId);
  if(r.status===401){ clearInterval(poll); window.location='/login'; return; }
  const j = await r.json();
  setStatus(j.status);
  $('log').textContent = j.log.join('\n');
  $('log').scrollTop = $('log').scrollHeight;
  renderResults(j.files);
  if(['done','error','cancelled'].includes(j.status)){
    clearInterval(poll); setActive(false);
    $('dl').disabled = !j.has_zip;
  }
}

$('dl').addEventListener('click', ()=>{
  if(jobId) window.location = '/download/'+jobId;
});
</script>
</body>
</html>
