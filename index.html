<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Newsletter Extractor</title>
<style>
  :root { --bg:#0f1115; --panel:#1a1d24; --border:#2a2f3a; --fg:#e6e9ef; --muted:#8b93a7; --acc:#6ea8fe; --ok:#3fb950; --err:#f85149; }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:24px}
  .head{max-width:980px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center}
  h1{margin:0;font-size:20px}
  .logout{color:var(--muted);text-decoration:none;font-size:12px;border:1px solid var(--border);padding:6px 10px;border-radius:6px}
  .logout:hover{color:var(--fg)}
  .wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:16px}
  label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea,button{font:inherit;color:var(--fg);background:#0c0e13;border:1px solid var(--border);border-radius:6px;padding:8px 10px;width:100%}
  textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
  button{background:var(--acc);color:#0c0e13;border:0;font-weight:600;cursor:pointer;margin-top:12px}
  button:disabled{opacity:.5;cursor:not-allowed}
  button.sec{background:transparent;color:var(--fg);border:1px solid var(--border)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .log{background:#06070a;border:1px solid var(--border);border-radius:6px;padding:10px;height:340px;overflow:auto;font-family:ui-monospace,monospace;font-size:11px;white-space:pre-wrap;line-height:1.5}
  .status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;background:#222;color:var(--muted)}
  .status.running{background:#1f3a5c;color:var(--acc)}
  .status.done{background:#1a3a26;color:var(--ok)}
  .status.error{background:#3a1a1a;color:var(--err)}
  .hint{font-size:11px;color:var(--muted);margin-top:4px}
  details{margin-top:8px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="head">
  <h1>📬 Newsletter Extractor</h1>
  <a class="logout" href="/logout">Sign out</a>
</div>
<div class="wrap">
  <div class="panel">
    <label>Credentials <span class="hint">(one per line, format: <code>email:password</code>)</span></label>
    <textarea id="creds" placeholder="me@gmail.com:app_password&#10;other@yahoo.com:xxxx"></textarea>
    <details><summary>IMAP help</summary>
      Gmail & Yahoo require an <b>app password</b> (not your normal password). Outlook/Hotmail/Live, t-online.de, AOL, iCloud also supported.
    </details>

    <label>Filter</label>
    <select id="filter">
      <option value="all">All emails</option>
      <option value="range">Range (start–end, newest=1)</option>
      <option value="last_days">Last N days</option>
      <option value="from">From specific sender</option>
    </select>

    <div id="opt_range" style="display:none" class="row">
      <div><label>Start</label><input id="range_start" type="number" value="1" min="1"></div>
      <div><label>End</label><input id="range_end" type="number" value="100" min="1"></div>
    </div>
    <div id="opt_days" style="display:none">
      <label>Days back</label><input id="days" type="number" value="30" min="1">
    </div>
    <div id="opt_from" style="display:none">
      <label>Sender address</label><input id="from_address" placeholder="news@example.com">
    </div>

    <label>Content mode</label>
    <select id="mode">
      <option value="html">Raw HTML (one line)</option>
      <option value="text">Text only (links removed)</option>
      <option value="html_no_text">HTML structure only (no text)</option>
    </select>

    <label>Batch size (newsletters per file)</label>
    <input id="batch_size" type="number" value="10" min="1">

    <button id="go">▶ Start extraction</button>
    <button id="dl" class="sec" disabled>⬇ Download results (.zip)</button>
  </div>

  <div class="panel">
    <div>Status: <span id="status" class="status">idle</span></div>
    <label style="margin-top:12px">Log</label>
    <div class="log" id="log">Waiting…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const filterSel = $('filter');
filterSel.addEventListener('change', () => {
  $('opt_range').style.display = filterSel.value === 'range' ? 'grid' : 'none';
  $('opt_days').style.display  = filterSel.value === 'last_days' ? 'block' : 'none';
  $('opt_from').style.display  = filterSel.value === 'from' ? 'block' : 'none';
});

let jobId = null, poll = null;

function setStatus(s) {
  const el = $('status'); el.textContent = s;
  el.className = 'status ' + (['running','done','error'].includes(s) ? s : '');
}

$('go').addEventListener('click', async () => {
  const lines = $('creds').value.trim().split('\n').map(l => l.trim()).filter(Boolean);
  const credentials = lines.map(l => {
    const i = l.indexOf(':');
    return i > 0 ? { email: l.slice(0,i).trim(), password: l.slice(i+1).trim() } : null;
  }).filter(Boolean);
  if (!credentials.length) { alert('Add at least one credential'); return; }

  const params = {
    credentials,
    content_mode: $('mode').value,
    filter_type: filterSel.value,
    batch_size: $('batch_size').value,
    range_start: $('range_start').value,
    range_end: $('range_end').value,
    days: $('days').value,
    from_address: $('from_address').value,
  };
  $('go').disabled = true; $('dl').disabled = true; $('log').textContent = '';
  setStatus('starting');
  const r = await fetch('/start', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(params)});
  if (r.status === 401) { window.location = '/login'; return; }
  const j = await r.json();
  if (j.error) { setStatus('error'); $('log').textContent = j.error; $('go').disabled = false; return; }
  jobId = j.job_id;
  poll = setInterval(checkStatus, 1200);
});

async function checkStatus() {
  if (!jobId) return;
  const r = await fetch('/status/' + jobId);
  if (r.status === 401) { clearInterval(poll); window.location = '/login'; return; }
  const j = await r.json();
  setStatus(j.status);
  $('log').textContent = j.log.join('\n');
  $('log').scrollTop = $('log').scrollHeight;
  if (j.status === 'done' || j.status === 'error') {
    clearInterval(poll);
    $('go').disabled = false;
    $('dl').disabled = !j.has_zip;
  }
}

$('dl').addEventListener('click', () => {
  if (jobId) window.location = '/download/' + jobId;
});
</script>
</body>
</html>
